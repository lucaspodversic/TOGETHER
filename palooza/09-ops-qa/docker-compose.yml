# EN: Local stack for Palooza. LOCAL ONLY — every published port is bound to 127.0.0.1.
#     Inside the compose network the API listens on 0.0.0.0 so the web container can reach it;
#     that bind never reaches the host. Secrets come from 09-ops-qa/.env (copy ../.env.example).
#     Usage (repo root): docker compose -f 09-ops-qa/docker-compose.yml --env-file 09-ops-qa/.env up --build
# ES: Stack local de Palooza. SOLO LOCAL — todo puerto publicado se ata a 127.0.0.1.
#     Dentro de la red de compose la API escucha en 0.0.0.0 para que la web la alcance;
#     ese bind nunca llega al host. Los secretos salen de 09-ops-qa/.env (copiar ../.env.example).
name: palooza

services:
  # EN: Local EVM chain for the optional badge contract (chainId 31337). / ES: Cadena EVM local para el contrato opcional de insignias.
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ["anvil", "--host", "0.0.0.0", "--chain-id", "31337"]
    ports: ["127.0.0.1:8545:8545"]

  api:
    build:
      context: ..
      dockerfile: 09-ops-qa/docker/Dockerfile.node
    image: palooza/api:local
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      NODE_ENV: production
      # EN: 0.0.0.0 only inside the container network. / ES: 0.0.0.0 solo dentro de la red del contenedor.
      HOST: 0.0.0.0
      PORT: "4100"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET (>=32 chars)}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CHAIN_ID: "31337"
      RPC_URL: http://anvil:8545
      # EN: Gated features stay OFF pending legal review. / ES: Funciones con compuerta en OFF hasta revisión legal.
      FEATURE_CASINO_GAMES: "false"
      FEATURE_BETTING: "false"
      FEATURE_TOKEN_REWARDS: "false"
      FEATURE_PAYOUTS: "false"
      FEATURE_MARKETPLACE: "false"
      FEATURE_NFT_MINT: "false"
    ports: ["127.0.0.1:4100:4100"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: 09-ops-qa/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4100}
    image: palooza/web:local
    restart: unless-stopped
    depends_on: [api]
    ports: ["127.0.0.1:3000:3000"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
